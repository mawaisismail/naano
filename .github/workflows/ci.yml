name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    # The integration tests run against real Postgres, because the claims they
    # make are claims about the data model. Locally they skip when no database
    # is configured; here one always is, so they always run.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: naano
          POSTGRES_DB: naano_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:naano@localhost:5432/naano_test
      TEST_DATABASE_URL: postgresql://postgres:naano@localhost:5432/naano_test
      SESSION_SECRET: ci-only-secret-not-used-anywhere-else-32ch

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
